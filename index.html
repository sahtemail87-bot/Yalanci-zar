<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yalancı Zarı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700 text-center">
        <h1 class="text-3xl font-bold text-amber-500 mb-2">Yalancı Zarı</h1>
        <p class="text-slate-400 text-sm mb-6">Blöf yap, zarını koru, rakiplerini ele!</p>

        <!-- Lobi Arayüzü -->
        <div id="lobby-screen" class="space-y-4">
            <input type="text" id="player-name" placeholder="Oyuncu Adınız" class="w-full px-4 py-2 bg-slate-700 rounded border border-slate-600 focus:outline-none focus:border-amber-500">
            <button id="btn-join" class="w-full bg-amber-600 hover:bg-amber-500 font-bold py-2 px-4 rounded transition">Oyuna Katıl</button>
        </div>

        <!-- Oyun Alanı -->
        <div id="game-screen" class="hidden space-y-6">
            <div id="status-msg" class="text-lg font-semibold text-amber-400">Oyuncular Bekleniyor...</div>
            
            <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                <h2 class="text-sm text-slate-400 mb-2">Sizin Zarlarınız</h2>
                <div id="my-dice" class="flex justify-center gap-2 text-2xl font-bold text-amber-400">
                    - - - - -
                </div>
            </div>

            <!-- Hamle Alanı -->
            <div id="action-area" class="space-y-3">
                <div class="flex gap-2">
                    <input type="number" id="bid-count" placeholder="Adet" min="1" class="w-1/2 px-3 py-2 bg-slate-700 rounded border border-slate-600">
                    <select id="bid-value" class="w-1/2 px-3 py-2 bg-slate-700 rounded border border-slate-600">
                        <option value="1">1'ler</option>
                        <option value="2">2'ler</option>
                        <option value="3">3'ler</option>
                        <option value="4">4'ler</option>
                        <option value="5">5'ler</option>
                        <option value="6">6'lar</option>
                    </select>
                </div>
                <button id="btn-bid" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2 rounded transition">Teklif Yap</button>
                <button id="btn-liar" class="w-full bg-rose-600 hover:bg-rose-500 font-bold py-2 rounded transition">Yalancı! (Meydan Oku)</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & Oyun Mantığı -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
